<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disponibilidade · Aurora</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><main class="container today-page"><header class="topbar"><div><p class="today-date">Configuração</p><h1>Minha disponibilidade</h1></div><nav class="nav-links"><a th:href="@{/hoje}">Voltar para Hoje</a></nav></header>
<div class="notice notice-success" th:if="${sucessoAcao}" th:text="${sucessoAcao}"></div><div class="notice notice-error" th:if="${erroAcao}" th:text="${erroAcao}"></div><div class="notice notice-error" th:if="${erroBanco}" th:text="${erroBanco}"></div>
<article class="card"><p class="meta">Cadastre até dois intervalos livres por dia. A grade orienta as sugestões; aulas, basquete, trabalho e viagens podem ser ajustados no dia. O início da manhã não foi presumido.</p></article>
<form class="card schedule-form" method="post" th:action="@{/horarios}" th:object="${form}"><div class="schedule-header"><span>Dia</span><span>Intervalo livre 1</span><span>Intervalo 2 (opcional)</span></div>
<div class="schedule-row" th:each="dia, stat : *{dias}"><strong th:text="${dia.nome}">Dia</strong><input type="hidden" th:field="*{dias[__${stat.index}__].diaSemana}"><input type="hidden" th:field="*{dias[__${stat.index}__].nome}">
<div class="schedule-slot"><input type="time" aria-label="Início do primeiro intervalo" th:field="*{dias[__${stat.index}__].inicio1}"><span>até</span><input type="time" aria-label="Fim do primeiro intervalo" th:field="*{dias[__${stat.index}__].fim1}"></div>
<div class="schedule-slot"><input type="time" aria-label="Início do segundo intervalo" th:field="*{dias[__${stat.index}__].inicio2}"><span>até</span><input type="time" aria-label="Fim do segundo intervalo" th:field="*{dias[__${stat.index}__].fim2}"></div></div><button type="submit">Salvar grade semanal</button></form></main></body></html>
