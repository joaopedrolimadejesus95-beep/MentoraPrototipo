<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Estudo</title>
</head>
<body>
    <h1>Cadastro de Estudo</h1>
    <form method="post" action="/cadastrar-estudo">
        <label>Matéria:</label>
        <input type="text" name="materia" required><br>

        <label>Status:</label>
        <select name="status">
            <option value="PENDENTE">Pendente</option>
            <option value="EM_ANDAMENTO">Em andamento</option>
            <option value="CONCLUIDO">Concluído</option>
        </select><br>

        <button type="submit">Cadastrar</button>
    </form>
</body>
</html>
